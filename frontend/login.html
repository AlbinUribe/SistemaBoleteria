<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Iniciar sesión · TiquetaDo</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="login" data-rol="">
    <header id="navbar"></header>
    <main class="wrap auth">
        <div class="card">
            <h1>Iniciar sesión</h1>
            <p class="muted">Usa tu correo o tu nombre de usuario.</p>
            <form id="formLogin" novalidate>
                <div class="f"><label for="identificador">Correo o usuario</label><input id="identificador"
                        name="identificador" type="text" required minlength="3" autocomplete="username"
                        placeholder="albin123 o correo@ejemplo.com"><small class="err"></small></div>
                <div class="f"><label for="password">Contraseña</label><input id="password" name="password"
                        type="password" required minlength="6" autocomplete="current-password"><small
                        class="err"></small></div>
                <p class="alert" id="msg" hidden></p><button class="btn full" type="submit">Entrar</button>
            </form>
            <p class="muted" style="margin-top:18px">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
        </div>
    </main>
    <div id="toast" class="toast" hidden></div>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
