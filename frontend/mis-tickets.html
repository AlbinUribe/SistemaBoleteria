<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Mis tickets · TiquetaDo</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="mis-tickets" data-rol="USUARIO">
    <header id="navbar"></header>
    <main class="wrap">
        <h1>Mis tickets</h1>
        <p class="muted" style="margin-bottom:18px">Historial de tus compras.</p>
        <div class="card">
            <div class="tw">
                <table>
                    <thead>
                        <tr>
                            <th>Orden</th>
                            <th>Fecha</th>
                            <th>Evento</th>
                            <th class="r">Tickets</th>
                            <th class="r">Total</th>
                            <th>Estado</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="ordenes"></tbody>
                </table>
            </div>
            <p id="vacio" class="muted" hidden>Aún no has realizado compras. <a href="eventos.html">Ver eventos</a></p>
        </div>
    </main>
    <div id="toast" class="toast" hidden></div>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/mis-tickets.js"></script>
</body>

</html>
