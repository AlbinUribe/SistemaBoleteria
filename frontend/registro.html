<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Crear cuenta · TiquetaDo</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="registro" data-rol="">
    <header id="navbar"></header>
    <main class="wrap auth">
        <div class="card">
            <h1>Crear cuenta</h1>
            <p class="muted">Te enviaremos un correo para verificar tu cuenta.</p>
            <form id="formRegistro" novalidate>
                <div class="f"><label for="nombreUsuario">Nombre de usuario</label><input id="nombreUsuario"
                        name="nombreUsuario" type="text" required pattern="[A-Za-z0-9_]{4,20}" maxlength="20"
                        autocomplete="username" placeholder="albin123"><small class="err"></small></div>
                <div class="f"><label for="correo">Correo electrónico</label><input id="correo" name="correo"
                        type="email" required maxlength="100" autocomplete="email"
                        placeholder="correo@ejemplo.com"><small class="err"></small></div>
                <div class="f"><label for="password">Contraseña</label><input id="password" name="password"
                        type="password" required minlength="8" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}"
                        autocomplete="new-password"><small class="err"></small></div>
                <small class="muted">Mínimo 8 caracteres, con letras y números.</small>
                <div class="f"><label for="confirmar">Confirmar contraseña</label><input id="confirmar" name="confirmar"
                        type="password" required autocomplete="new-password"><small class="err"></small></div>
                <p class="alert" id="msg" hidden></p><button class="btn full" type="submit">Registrarme</button>
            </form>
            <p class="muted" style="margin-top:18px">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </div>
    </main>
    <div id="toast" class="toast" hidden></div>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/registro.js"></script>
</body>

</html>
