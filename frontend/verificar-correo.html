<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Verificar correo · TiquetaDo</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="verificar-correo" data-rol="">
    <header id="navbar"></header>
    <main class="wrap auth">
        <div class="card" style="text-align:center">
            <div class="okicon">✉</div>
            <h1>Revisa tu correo</h1>
            <p class="muted" id="destino">Te enviamos un código de verificación.</p>
            <form id="formCodigo" novalidate style="text-align:left">
                <div class="f"><label for="codigo">Código de verificación</label><input id="codigo" name="codigo"
                        type="text" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                        placeholder="6 dígitos"><small class="err"></small></div>
                <p class="alert" id="msg" hidden></p><button class="btn full" type="submit">Verificar cuenta</button>
            </form>
            <button class="btn out full" id="btnReenviar" type="button">Reenviar correo</button>
        </div>
    </main>
    <div id="toast" class="toast" hidden></div>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/verificar-correo.js"></script>
</body>

</html>
